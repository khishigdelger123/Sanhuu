<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Санхүү">
<meta name="theme-color" content="#0f172a">
<meta name="description" content="Хувийн орлого зарлагын бүртгэл">
<title>Санхүү — Орлого Зарлага</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --card2: #334155;
    --text: #f8fafc;
    --muted: #94a3b8;
    --primary: #3b82f6;
    --green: #22c55e;
    --red: #ef4444;
    --border: #334155;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    padding-bottom: calc(90px + env(safe-area-inset-bottom));
    line-height: 1.4;
  }
  header {
    background: linear-gradient(160deg, #1e3a5f 0%, #0f172a 100%);
    padding: 18px 18px 22px;
    padding-top: calc(18px + env(safe-area-inset-top));
    position: sticky;
    top: 0;
    z-index: 50;
  }
  header h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.02em; }
  header p { font-size: 0.78rem; color: #7dd3fc; margin-top: 3px; opacity: 0.9; }

  .summary {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 14px 16px 6px;
  }
  .sum-card {
    background: var(--card);
    border-radius: 16px;
    padding: 14px;
    border: 1px solid var(--border);
  }
  .sum-card .label { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600; }
  .sum-card .value { font-size: 1.2rem; font-weight: 700; margin-top: 6px; letter-spacing: -0.02em; }
  .sum-card.income .value { color: var(--green); }
  .sum-card.expense .value { color: var(--red); }
  .sum-card.net {
    grid-column: 1 / -1;
    background: linear-gradient(135deg, #1e40af, #3b82f6);
    border: none;
    margin-top: 2px;
  }
  .sum-card.net .label { color: rgba(255,255,255,0.75); }
  .sum-card.net .value { font-size: 1.5rem; color: #fff; }

  .tabs {
    display: flex;
    gap: 8px;
    padding: 12px 16px 14px;
    overflow-x: auto;
  }
  .tab {
    flex-shrink: 0;
    padding: 9px 16px;
    border-radius: 999px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 0.88rem;
    font-weight: 600;
    cursor: pointer;
    transition: 0.15s;
  }
  .tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }

  .list { padding: 0 16px; display: flex; flex-direction: column; gap: 8px; }
  .item {
    background: var(--card);
    border-radius: 14px;
    padding: 13px 14px;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .item .icon {
    width: 40px; height: 40px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem; flex-shrink: 0;
  }
  .item .icon.in { background: rgba(34,197,94,0.15); }
  .item .icon.out { background: rgba(239,68,68,0.15); }
  .item .body { flex: 1; min-width: 0; }
  .item .title { font-weight: 600; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .meta { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }
  .item .amount { font-weight: 700; font-size: 1rem; white-space: nowrap; }
  .item .amount.plus { color: var(--green); }
  .item .amount.minus { color: var(--red); }
  .item .del {
    background: none; border: none; color: var(--muted);
    font-size: 1.25rem; padding: 6px; cursor: pointer; line-height: 1;
    opacity: 0.6;
  }
  .empty {
    text-align: center; padding: 48px 24px; color: var(--muted); font-size: 0.92rem;
  }
  .empty span { display: block; font-size: 2rem; margin-bottom: 10px; opacity: 0.5; }

  .fab {
    position: fixed;
    bottom: calc(22px + env(safe-area-inset-bottom));
    right: 18px;
    width: 58px; height: 58px;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    border: none;
    font-size: 1.9rem;
    font-weight: 300;
    box-shadow: 0 8px 24px rgba(59,130,246,0.45);
    cursor: pointer;
    z-index: 80;
    display: flex; align-items: center; justify-content: center;
  }

  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.65);
    backdrop-filter: blur(4px);
    z-index: 200;
    display: none;
    align-items: flex-end;
    justify-content: center;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--card);
    width: 100%;
    max-width: 480px;
    border-radius: 22px 22px 0 0;
    padding: 22px 18px calc(28px + env(safe-area-inset-bottom));
    max-height: 88vh;
    overflow-y: auto;
  }
  .modal h2 { font-size: 1.2rem; margin-bottom: 18px; font-weight: 700; }
  .type-toggle { display: flex; gap: 8px; margin-bottom: 16px; }
  .type-btn {
    flex: 1; padding: 11px; border-radius: 12px; border: 1.5px solid var(--border);
    background: var(--bg); color: var(--muted); font-weight: 600; font-size: 0.9rem; cursor: pointer;
  }
  .type-btn.active.income { background: rgba(34,197,94,0.18); color: var(--green); border-color: var(--green); }
  .type-btn.active.expense { background: rgba(239,68,68,0.18); color: var(--red); border-color: var(--red); }
  .form-group { margin-bottom: 14px; }
  .form-group label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
  .form-group input {
    width: 100%;
    padding: 13px 14px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 1.05rem;
    outline: none;
  }
  .form-group input:focus { border-color: var(--primary); }
  .btn-row { display: flex; gap: 10px; margin-top: 20px; }
  .btn {
    flex: 1; padding: 15px; border-radius: 14px; border: none;
    font-size: 1rem; font-weight: 600; cursor: pointer;
  }
  .btn-primary { background: var(--primary); color: #fff; }
  .btn-secondary { background: var(--card2); color: var(--text); }
</style>
</head>
<body>
<header>
  <h1>Санхүү</h1>
  <p>Хувийн орлого · зарлагын бүртгэл</p>
</header>

<div class="summary">
  <div class="sum-card income">
    <div class="label">Орлого</div>
    <div class="value" id="totalIncome">0 ₮</div>
  </div>
  <div class="sum-card expense">
    <div class="label">Зарлага</div>
    <div class="value" id="totalExpense">0 ₮</div>
  </div>
  <div class="sum-card net">
    <div class="label">Үлдэгдэл</div>
    <div class="value" id="netBalance">0 ₮</div>
  </div>
</div>

<div class="tabs">
  <button class="tab active" data-tab="all">Бүгд</button>
  <button class="tab" data-tab="income">Орлого</button>
  <button class="tab" data-tab="expense">Зарлага</button>
</div>

<div class="list" id="itemList"></div>

<button class="fab" id="fabBtn" aria-label="Нэмэх">+</button>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2>Шинэ бүртгэл</h2>
    <div class="type-toggle">
      <button class="type-btn active income" data-type="income">Орлого</button>
      <button class="type-btn expense" data-type="expense">Зарлага</button>
    </div>
    <div class="form-group">
      <label>Огноо</label>
      <input type="date" id="fDate">
    </div>
    <div class="form-group">
      <label>Юу вэ?</label>
      <input type="text" id="fTitle" placeholder="Цалин, Хоол, Тээвэр..." autocomplete="off">
    </div>
    <div class="form-group">
      <label>Дүн (₮)</label>
      <input type="number" id="fAmount" placeholder="0" inputmode="numeric">
    </div>
    <div class="form-group">
      <label>Тэмдэглэл (заавал биш)</label>
      <input type="text" id="fNote" placeholder="Нэмэлт мэдээлэл" autocomplete="off">
    </div>
    <div class="btn-row">
      <button class="btn btn-secondary" id="cancelBtn">Болих</button>
      <button class="btn btn-primary" id="saveBtn">Хадгалах</button>
    </div>
  </div>
</div>

<script>
const KEY = 'sanhuu_v2';
let records = JSON.parse(localStorage.getItem(KEY) || '[]');
let currentType = 'income';
let currentTab = 'all';

const $ = id => document.getElementById(id);
const money = n => (Number(n) || 0).toLocaleString('mn-MN') + ' ₮';

function save() {
  localStorage.setItem(KEY, JSON.stringify(records));
  render();
}

function render() {
  const list = $('itemList');
  let items = currentTab === 'all' ? records : records.filter(r => r.type === currentTab);
  items = [...items].sort((a, b) => (b.date || '').localeCompare(a.date || ''));

  if (!items.length) {
    list.innerHTML = `<div class="empty"><span>📭</span>Бүртгэл байхгүй.<br>Доорх + товчийг дарна уу.</div>`;
  } else {
    list.innerHTML = items.map(r => {
      const isOut = r.type === 'expense';
      return `<div class="item">
        <div class="icon ${isOut ? 'out' : 'in'}">${isOut ? '↓' : '↑'}</div>
        <div class="body">
          <div class="title">${esc(r.title || '—')}</div>
          <div class="meta">${r.date || ''}${r.note ? ' · ' + esc(r.note) : ''}</div>
        </div>
        <div class="amount ${isOut ? 'minus' : 'plus'}">${isOut ? '−' : '+'}${money(r.amount)}</div>
        <button class="del" data-id="${r.id}">×</button>
      </div>`;
    }).join('');
  }

  const income = records.filter(r => r.type === 'income').reduce((s, r) => s + (+r.amount || 0), 0);
  const expense = records.filter(r => r.type === 'expense').reduce((s, r) => s + (+r.amount || 0), 0);
  const net = income - expense;

  $('totalIncome').textContent = money(income);
  $('totalExpense').textContent = money(expense);
  $('netBalance').textContent = money(net);
  $('netBalance').style.color = net >= 0 ? '#fff' : '#fca5a5';
}

function esc(t) {
  const d = document.createElement('div');
  d.textContent = t;
  return d.innerHTML;
}

document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentTab = btn.dataset.tab;
    render();
  });
});

document.querySelectorAll('.type-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentType = btn.dataset.type;
  });
});

$('fabBtn').onclick = () => {
  $('fDate').value = new Date().toISOString().slice(0, 10);
  $('fTitle').value = '';
  $('fAmount').value = '';
  $('fNote').value = '';
  currentType = 'income';
  document.querySelectorAll('.type-btn').forEach(b => b.classList.toggle('active', b.dataset.type === 'income'));
  $('modal').classList.add('show');
  setTimeout(() => $('fTitle').focus(), 100);
};

$('cancelBtn').onclick = () => $('modal').classList.remove('show');
$('modal').onclick = e => { if (e.target === $('modal')) $('modal').classList.remove('show'); };

$('saveBtn').onclick = () => {
  const title = $('fTitle').value.trim();
  const amount = parseFloat($('fAmount').value) || 0;
  if (!title || amount <= 0) {
    alert('Тайлбар болон дүнгээ оруулна уу');
    return;
  }
  records.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
    type: currentType,
    title,
    amount,
    date: $('fDate').value,
    note: $('fNote').value.trim()
  });
  save();
  $('modal').classList.remove('show');
};

$('itemList').onclick = e => {
  if (e.target.classList.contains('del')) {
    if (confirm('Устгах уу?')) {
      records = records.filter(r => r.id !== e.target.dataset.id);
      save();
    }
  }
};

render();
</script>
</body>
</html>
